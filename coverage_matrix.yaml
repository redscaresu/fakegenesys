# coverage_matrix.yaml — per-resource coverage tracking.
#
# Each resource entry pins: integration test file, example dirs (3
# trees), and the scenario anchor in infrafactory that exercises it
# end-to-end. The `examples_disposition` field encodes
# `working+updates+misconfigured` coverage (3 = all three trees ship).
#
# Lands as resources arrive. S108 ships an empty matrix; S109 fills
# in identity; S110 fills routing; S111 fills architect.
version: 1
resources:
  - name: user
    landed_in: S109
    integration_test: handlers/identity_test.go::TestUser_*
    examples_disposition: 3   # working + updates + misconfigured
    spec_endpoints:
      - "POST   /api/v2/users"
      - "GET    /api/v2/users"
      - "GET    /api/v2/users/{userId}"
      - "PATCH  /api/v2/users/{userId}"
      - "DELETE /api/v2/users/{userId}"
    scenario_anchor: scenarios/training/genesys-basic-queue.yaml  # (S114-T4)

